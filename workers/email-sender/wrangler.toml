# Deploy: npx wrangler deploy --config workers/email-sender/wrangler.toml
# Sends Perlink's emails through Cloudflare Email Sending, and receives mail
# to support@perlink.to (Email Routing → this Worker): it forwards each one to
# FORWARD_TO as before and keeps a copy for Superadmin → Emails. It has no
# public URL: only the Pages app reaches it, through its EMAIL_WORKER service
# binding (wrangler.jsonc). See docs/email.md.
name = "perlink-email"
main = "index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[vars]
# Where support@perlink.to mail is still forwarded (a verified destination in Email Routing)
FORWARD_TO = "kimduc10a@gmail.com"

[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "perlink_to_db"
database_id = "b2b46bb2-c690-4564-819e-5fb25ad56970"

# Attachments of received mail (private bucket)
[[r2_buckets]]
binding = "MAIL"
bucket_name = "perlink-mail"
